name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only ever needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        # Tests are hermetic: no DATABASE_URL, no AUTH_PASSWORD, no network.
        run: python -m pytest
      - name: Dependency audit (pip-audit)
        # Surfaced as a warning: a newly published advisory should not be able
        # to hard-fail every unrelated PR.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: jsdom (vitest's environment) depends on undici >= 8,
          # which requires Node >= 22 — on Node 20 vitest dies with
          # "webidl.util.markAsUncloneable is not a function".
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      # NOTE: `next` currently carries critical advisories with no patched
      # 14.x release (see LIMITATIONS.md). This step is advisory so it
      # surfaces new advisories without blocking merges; it is NOT a claim
      # that the tree is currently free of them.
      - name: Dependency audit (npm)
        continue-on-error: true
        run: npm audit --audit-level=high
