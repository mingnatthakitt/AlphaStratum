version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/nextjs-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Security updates are what matter most here; group the rest so the PR
    # stream stays readable.
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom"]

  - package-ecosystem: "pip"
    directory: "/fastapi-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
